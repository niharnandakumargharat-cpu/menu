<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printable Table QR & NFC Stand Generator | Digital Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    h1, h2, h3, .font-heading { font-family: 'Outfit', sans-serif; }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; }
      .print-grid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 20px !important; }
      .qr-card { page-break-inside: avoid; border: 2px dashed #94a3b8 !important; box-shadow: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 text-slate-800">

  <!-- Admin Controls Panel (Hidden when printing) -->
  <div class="max-w-4xl mx-auto mb-8 no-print">
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-100">
        <div>
          <span class="text-xs font-black uppercase tracking-wider text-orange-600 bg-orange-50 px-3 py-1 rounded-full border border-orange-200">
            Tabletop QR & NFC Stand Maker
          </span>
          <h1 class="text-2xl font-black text-slate-900 mt-2 font-heading">
            Table QR Code Generator
          </h1>
          <p class="text-xs text-slate-500 mt-1">
            Print table tent cards for customers to scan with their phone camera or tap via NFC.
          </p>
        </div>

        <div class="flex items-center gap-3">
          <a href="index.html" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
            &larr; View Digital Menu
          </a>
          <button onclick="window.print()" class="px-5 py-2.5 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-black shadow-lg shadow-orange-600/30 flex items-center gap-2 transition">
            🖨️ Print All Cards (Ctrl+P)
          </button>
        </div>
      </div>

      <!-- Controls Form -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Base Menu Website URL</label>
          <input 
            type="text" 
            id="base-url-input" 
            placeholder="e.g. https://yourcafe.com/ or leave blank" 
            class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-orange-500"
          />
          <span class="text-[10px] text-slate-400">Leave blank to use current local/hosted link</span>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Number of Tables</label>
          <select id="table-count-select" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-orange-500" onchange="generateAllQRCodes()">
            <option value="4">4 Tables</option>
            <option value="6">6 Tables</option>
            <option value="8" selected>8 Tables</option>
            <option value="12">12 Tables</option>
            <option value="16">16 Tables</option>
            <option value="20">20 Tables</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Cafe / Restaurant Name</label>
          <input 
            type="text" 
            id="cafe-name-input" 
            value="CAFE BISTRO & BITES" 
            class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-orange-500"
            oninput="generateAllQRCodes()"
          />
        </div>
      </div>
    </div>
  </div>

  <!-- QR Cards Container for Printing & Preview -->
  <div class="max-w-4xl mx-auto">
    <div id="qr-cards-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 gap-6 print-grid">
      <!-- Generated Cards dynamically -->
    </div>
  </div>

  <script>
    function getBaseMenuUrl() {
      const customUrl = document.getElementById('base-url-input').value.trim();
      if (customUrl) return customUrl.endsWith('/') ? customUrl : customUrl + '/';
      
      const loc = window.location.href;
      const baseUrl = loc.substring(0, loc.lastIndexOf('/')) + '/index.html';
      return baseUrl;
    }

    function generateAllQRCodes() {
      const container = document.getElementById('qr-cards-grid');
      const tableCount = parseInt(document.getElementById('table-count-select').value, 10);
      const cafeName = document.getElementById('cafe-name-input').value || 'CAFE BISTRO & BITES';
      const baseUrl = getBaseMenuUrl();

      container.innerHTML = '';

      for (let i = 1; i <= tableCount; i++) {
        const tableUrl = baseUrl.includes('?') ? `${baseUrl}&table=${i}` : `${baseUrl}?table=${i}`;
        const cardId = `qr-code-${i}`;

        const cardEl = document.createElement('div');
        cardEl.className = 'qr-card bg-white rounded-3xl p-6 shadow-sm border border-slate-200 text-center flex flex-col items-center justify-between relative overflow-hidden';
        cardEl.innerHTML = `
          <!-- Top Tag -->
          <div class="w-full flex items-center justify-between border-b border-slate-100 pb-3 mb-3">
            <span class="text-[10px] font-extrabold uppercase tracking-wider text-orange-600 bg-orange-50 px-2.5 py-0.5 rounded-md">
              📖 Digital Menu
            </span>
            <span class="text-xs font-black text-slate-400">QR • NFC</span>
          </div>

          <!-- Restaurant Name & Table Header -->
          <div class="mb-2">
            <h2 class="text-base font-black text-slate-900 font-heading tracking-tight">${cafeName}</h2>
            <div class="mt-1 inline-block bg-gradient-to-r from-orange-500 to-amber-500 text-white font-black text-xs px-3.5 py-0.5 rounded-full shadow-sm">
              TABLE #${i}
            </div>
          </div>

          <!-- QR Code Canvas Container -->
          <div class="p-3 bg-slate-50 border-2 border-dashed border-orange-200 rounded-2xl my-2 shadow-inner">
            <div id="${cardId}" class="flex items-center justify-center"></div>
          </div>

          <!-- Scan Prompt -->
          <div class="mt-2 text-xs font-black text-slate-800">
            📱 Scan QR or Tap NFC Phone
          </div>
          <div class="text-[11px] text-slate-400 mt-0.5">
            To view full digital food & drink menu
          </div>

          <!-- WiFi Info Footer -->
          <div class="w-full mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-500 font-medium">
            <span>📶 Wi-Fi: <b>Cafe_Guest_WiFi</b></span>
            <span>Pass: <b>enjoyfood2026</b></span>
          </div>
        `;

        container.appendChild(cardEl);

        setTimeout(() => {
          new QRCode(document.getElementById(cardId), {
            text: tableUrl,
            width: 140,
            height: 140,
            colorDark: '#0f172a',
            colorLight: '#f8fafc',
            correctLevel: QRCode.CorrectLevel.H
          });
        }, 10);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('base-url-input').addEventListener('input', generateAllQRCodes);
      generateAllQRCodes();
    });
  </script>
</body>
</html>
